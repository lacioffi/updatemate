[project]
name = "up2date_client"
version = "0.1.0"
description = ""
authors = [
    {name = "lacioffi",email = "lucasacioffi@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pathlib (>=1.0.1,<2.0.0)",
    "pywin32 (>=311,<312)",
    "lief (>=0.17.6,<0.18.0)"
]

[tool.poetry]
packages = [{include = "up2date_client", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[project.scripts]
up2date_client = "up2date_client.gui:run_app"