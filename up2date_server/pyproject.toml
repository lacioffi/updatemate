[project]
name = "up2date_server"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pymerkle (>=6.1.0,<7.0.0)",
    "requests (>=2.33.0,<3.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "db (>=0.1.1,<0.2.0)",
    "routes (>=2.5.1,<3.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.poetry]
packages = [{include = "up2date_server", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[pytest]
addopts = ["--import-mode=importlib"]